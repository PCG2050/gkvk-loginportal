<div
  class="sidenav"
  [ngClass]="isLeftSidebarCollapsed ? 'sidenav-collapsed' : ''"
>
  <div class="logo-container">
    <button class="logo" (click)="toggleCollapse()">
      <i class="fal fa-bars"></i>
    </button>
    @if (!isLeftSidebarCollapsed) {
      <div class="logo-text">{{logoText}}</div>
    }
  </div>
  <div class="sidenav-nav">
   @for (item of items; track $index) {
  @if (item.roles.includes(currentUser)) {
    <li class="sidenav-nav-item">
      <a
        class="sidenav-nav-link"
        [routerLink]="item.routeLink"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="item.routeLink === 'signout' && onSignOutClick($event)"
      >
        <i class="sidenav-link-icon" [class]="item.icon"></i>
        @if (!isLeftSidebarCollapsed) {
          <span class="sidenav-link-text">{{item.label}}</span>
        }
      </a>
    </li>
  }
}
  </div>
</div>
<div class="modal-backdrop" *ngIf="showSignOutConfirm">
  <div class="modal">
    <h3>Sign Out</h3>
    <p>Are you sure you want to sign out?</p>
    <div class="modal-actions">
      <button (click)="confirmSignOut()">Yes, Sign Out</button>
      <button (click)="cancelSignOut()">Cancel</button>
    </div>
  </div>
</div>
