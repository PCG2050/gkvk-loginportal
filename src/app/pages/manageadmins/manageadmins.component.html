<button class="back-btn" (click)="onBackToDashBoard()"><i class="bi bi-chevron-left"></i>Back</button>
<div>
    <ul>
        <li [class.active]="isManageAdminTabActive" class="tab" (click)="manageAdminTabEditor()">Manage Admins</li>
        <li [class.active]="isAdminTabActive" class="tab" (click)="addAdminTab()">Add Admin</li>
    </ul>
    <div class="isAdminTabActive" *ngIf="adminTab">
        <form action="" [formGroup]="AdminForm" class="adminForm">
            <label for="firstName">First Name</label>
            <input type="text" placeholder="Enter FirstName" formControlName="firstName">
            <label for="lastName">Last Name</label>
            <input type="text" placeholder="LastName" formControlName="lastName">
            <label for="phone">Phone Number</label>
            <input type="text" placeholder="Enter Phone Number" formControlName="phoneNumber">
            <label for="email">Email</label>
            <input type="text" placeholder="Enter Email" formControlName="email">
            <label for="password">Password</label>
            <input type="text" placeholder="Enter Password" formContolName="password">
            <button type="submit" (click)="addAdmins()">Add</button>
        </form>
    </div>
    <div class="isManageAdminTabActive" *ngIf="manageAdminTab">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Sl No</th>
                    <th>Name</th>
                    <th>Phone Number</th>
                    <th>Email</th>
                    <th>Is Deactivated</th>
                </tr>
            </thead>
            <tbody *ngIf="admins$ | async as admins">
                <tr *ngFor="let admin of admins; let i = index">
                    <td>{{i+1}}</td>
                    <td>{{admin.firstName}} {{admin.lastName}}</td>
                    <td>{{admin.phone}}</td>
                    <td>{{admin.email}}</td>
                    <td>
                        <!-- <input class="form-check-input" type="checkbox" role="switch" id="mySwitch"
                            [(ngModel)]="admin.isDeactivated">
                        <label class="form-check-label" [for]="'switch-' + admin.email">
                            {{ admin.isDeactivated ? 'Deactivated' : 'Active' }}
                        </label> -->
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="mySwitch"
                                [checked]="admin.isDeactivated" [(ngModel)]="admin.isDeactivated">

                            <label class="form-check-label" [for]="'switch-' + admin.email">
                                {{ admin.isDeactivated ? 'Deactivated' : 'Active' }}
                            </label>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="viewAdmins"></div>
</div> -->
